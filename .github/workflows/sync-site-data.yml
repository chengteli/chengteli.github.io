name: sync-public-data
# 纯静态方案（方案B）：已停用自动同步。
# 原流程每 5 分钟从失效的七牛/Cloudflare Worker 拉取数据并覆盖 portfolio-data/site-data.json，
# 改为 GitHub 静态托管后不再自动运行，避免定时把失效数据写回、误删手动放置的媒体。
# 本工作流仅保留手动触发入口，且为空操作；如需恢复自动同步请重新编写。
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "static mode: auto sync disabled"
